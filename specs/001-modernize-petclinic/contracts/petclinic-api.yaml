openapi: 3.0.3
info:
  title: Spring Petclinic REST API
  description: |
    REST API for the Spring Petclinic application.
    This contract documents the existing API endpoints that must be preserved
    during the modernization upgrade to Spring Boot 3.5.x.
  version: 2.0.0
  contact:
    name: Petclinic Team
servers:
  - url: http://localhost:9966/petclinic
    description: Development server
  - url: http://localhost:8080/petclinic
    description: Production server

tags:
  - name: owners
    description: Owner management operations
  - name: pets
    description: Pet management operations
  - name: visits
    description: Visit scheduling operations
  - name: vets
    description: Veterinarian listing operations
  - name: pettypes
    description: Pet type lookup operations

paths:
  # ==================== OWNERS ====================
  /api/owners:
    get:
      tags:
        - owners
      summary: List all owners or search by last name
      operationId: getOwners
      parameters:
        - name: lastName
          in: query
          required: false
          description: Filter owners by last name (case-insensitive, partial match)
          schema:
            type: string
      responses:
        '200':
          description: List of owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
        '304':
          description: Not modified (ETag match)

    post:
      tags:
        - owners
      summary: Create a new owner
      operationId: createOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '201':
          description: Owner created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/owners/{ownerId}:
    get:
      tags:
        - owners
      summary: Get owner by ID
      operationId: getOwnerById
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '200':
          description: Owner details with pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          description: Owner not found

    put:
      tags:
        - owners
      summary: Update an existing owner
      operationId: updateOwner
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '200':
          description: Owner updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Owner not found

  # ==================== PETS ====================
  /api/owners/{ownerId}/pets:
    get:
      tags:
        - pets
      summary: Get all pets for an owner
      operationId: getPetsByOwner
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '200':
          description: List of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '404':
          description: Owner not found

    post:
      tags:
        - pets
      summary: Add a new pet to an owner
      operationId: createPet
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Owner not found

  /api/owners/{ownerId}/pets/{petId}:
    get:
      tags:
        - pets
      summary: Get pet by ID
      operationId: getPetById
      parameters:
        - $ref: '#/components/parameters/ownerId'
        - $ref: '#/components/parameters/petId'
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet or owner not found

    put:
      tags:
        - pets
      summary: Update an existing pet
      operationId: updatePet
      parameters:
        - $ref: '#/components/parameters/ownerId'
        - $ref: '#/components/parameters/petId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Pet or owner not found

  # ==================== VISITS ====================
  /api/owners/{ownerId}/pets/{petId}/visits:
    get:
      tags:
        - visits
      summary: Get all visits for a pet
      operationId: getVisitsByPet
      parameters:
        - $ref: '#/components/parameters/ownerId'
        - $ref: '#/components/parameters/petId'
      responses:
        '200':
          description: List of visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
        '404':
          description: Pet or owner not found

    post:
      tags:
        - visits
      summary: Schedule a new visit for a pet
      operationId: createVisit
      parameters:
        - $ref: '#/components/parameters/ownerId'
        - $ref: '#/components/parameters/petId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitInput'
      responses:
        '201':
          description: Visit scheduled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Pet or owner not found

  # ==================== VETS ====================
  /api/vets:
    get:
      tags:
        - vets
      summary: List all veterinarians
      operationId: getVets
      responses:
        '200':
          description: List of veterinarians with their specialties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vet'
        '304':
          description: Not modified (ETag match)

  # ==================== PET TYPES ====================
  /api/pettypes:
    get:
      tags:
        - pettypes
      summary: List all pet types
      operationId: getPetTypes
      responses:
        '200':
          description: List of available pet types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetType'

components:
  parameters:
    ownerId:
      name: ownerId
      in: path
      required: true
      description: Owner ID
      schema:
        type: integer
        format: int32
        example: 1

    petId:
      name: petId
      in: path
      required: true
      description: Pet ID
      schema:
        type: integer
        format: int32
        example: 1

  schemas:
    # ==================== INPUT SCHEMAS ====================
    OwnerInput:
      type: object
      required:
        - firstName
        - lastName
        - address
        - city
        - telephone
      properties:
        firstName:
          type: string
          maxLength: 255
          example: George
        lastName:
          type: string
          maxLength: 255
          example: Franklin
        address:
          type: string
          maxLength: 255
          example: 110 W. Liberty St.
        city:
          type: string
          maxLength: 255
          example: Madison
        telephone:
          type: string
          pattern: '^\d{10}$'
          example: '6085551023'
          description: Must be exactly 10 digits

    PetInput:
      type: object
      required:
        - name
        - typeId
      properties:
        name:
          type: string
          maxLength: 255
          example: Leo
        birthDate:
          type: string
          format: date
          example: '2020-09-07'
        typeId:
          type: integer
          format: int32
          example: 1
          description: Reference to PetType ID

    VisitInput:
      type: object
      required:
        - description
      properties:
        date:
          type: string
          format: date
          example: '2024-01-15'
          description: Defaults to current date if not provided
        description:
          type: string
          maxLength: 255
          example: Annual checkup

    # ==================== OUTPUT SCHEMAS ====================
    Owner:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        firstName:
          type: string
          example: George
        lastName:
          type: string
          example: Franklin
        address:
          type: string
          example: 110 W. Liberty St.
        city:
          type: string
          example: Madison
        telephone:
          type: string
          example: '6085551023'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'

    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: Leo
        birthDate:
          type: string
          format: date
          example: '2020-09-07'
        type:
          $ref: '#/components/schemas/PetType'
        visits:
          type: array
          items:
            $ref: '#/components/schemas/Visit'

    PetType:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: cat

    Visit:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        date:
          type: string
          format: date
          example: '2024-01-15'
        description:
          type: string
          example: Annual checkup

    Vet:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        firstName:
          type: string
          example: James
        lastName:
          type: string
          example: Carter
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/Specialty'
        nrOfSpecialties:
          type: integer
          format: int32
          description: Count of specialties (0 means general practitioner)

    Specialty:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: radiology

    # ==================== ERROR SCHEMAS ====================
    ValidationError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        path:
          type: string
          example: /api/owners

    FieldError:
      type: object
      properties:
        field:
          type: string
          example: telephone
        message:
          type: string
          example: numeric value out of bounds (<10 digits>.<0 digits> expected)
        rejectedValue:
          type: string
          example: '123'
